# Include in the http context. Replace example domains and certificate paths.
log_format qushuiyin_safe '$time_iso8601 $request_method $uri $status $body_bytes_sent $request_time';

upstream qushuiyin {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
    access_log off;
    error_log /dev/null crit;
}

server {
    listen 443 ssl;
    server_name api.example.invalid;
    ssl_certificate /etc/qushuiyin/tls/api.fullchain.pem;
    ssl_certificate_key /etc/qushuiyin/tls/api.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/qushuiyin-api.log qushuiyin_safe;
    error_log /dev/null crit;

    # Match §16 max_request_body_bytes and API read/write timeouts.
    client_max_body_size 64k;
    client_body_timeout 25s;
    proxy_connect_timeout 25s;
    proxy_read_timeout 25s;
    proxy_send_timeout 25s;
    location ^~ /v1/ { include /etc/nginx/snippets/qushuiyin-proxy.conf; }
    location / { return 404; }
}

server {
    listen 443 ssl;
    server_name media.example.invalid;
    ssl_certificate /etc/qushuiyin/tls/media.fullchain.pem;
    ssl_certificate_key /etc/qushuiyin/tls/media.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/qushuiyin-media.log qushuiyin_safe;
    error_log /dev/null crit;

    client_max_body_size 64k;
    client_body_timeout 25s;
    proxy_connect_timeout 25s;
    # Match the §16 media transfer budget. Stream directly without temp files.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    send_timeout 120s;
    location ~ ^/media/(download|preview|thumbnail|image)/ {
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        include /etc/nginx/snippets/qushuiyin-proxy.conf;
    }
    location / { return 404; }
}

server {
    listen 443 ssl;
    server_name ops.example.invalid;
    ssl_certificate /etc/qushuiyin/tls/ops.fullchain.pem;
    ssl_certificate_key /etc/qushuiyin/tls/ops.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/qushuiyin-admin.log qushuiyin_safe;
    error_log /dev/null crit;

    # Add the actual VPN or management source ranges before publishing.
    allow 127.0.0.1;
    allow ::1;
    deny all;
    client_max_body_size 64k;
    client_body_timeout 25s;
    proxy_connect_timeout 25s;
    proxy_read_timeout 25s;
    proxy_send_timeout 25s;
    location = /admin { include /etc/nginx/snippets/qushuiyin-proxy.conf; }
    location ^~ /admin/ { include /etc/nginx/snippets/qushuiyin-proxy.conf; }
    location / { return 404; }
}
